version: "3.9"

services:

  traefik:
    image: traefik:v3.0
    container_name: traefik

    command:
      - "--api.insecure=true"
      - "--configFile=/etc/traefik/traefik.yml"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--log.level=DEBUG"

    depends_on:
      jaeger:
        condition: service_started
      otel-collector:
        condition: service_started

    ports:
      - "80:80"
      - "8080:8080"

    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik:/etc/traefik/dynamic

    networks:
      - proxy

  consul:
    image: hashicorp/consul:latest
    container_name: consul
    ports:
      - "8500:8500"
    command: "agent -dev -client=0.0.0.0"
    networks:
      - backend

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: leave_management
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s
    networks:
      - backend

  jaeger:
    image: jaegertracing/all-in-one:1.41
    container_name: jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "6831:6831/udp"   # Jaeger agent (UDP) for clients
      - "14250:14250"     # gRPC collector (Thrift)
      - "14268:14268"     # HTTP collector (Thrift)
      - "9411:9411"       # Zipkin compatible endpoint
      - "16686:16686"     # UI
    networks:
      - backend
      - proxy

  otel-collector:
    image: otel/opentelemetry-collector:0.92.0
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    ports:
      - "4317:4317"       # OTLP gRPC receiver
      - "4318:4318"       # OTLP HTTP receiver
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    depends_on:
      - jaeger
    restart: on-failure
    networks:
      - backend
      - proxy

  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service
    env_file: .env
    expose:
      - "8001"
    
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_started
      otel-collector:
        condition: service_started
    volumes:
      - ./shared:/app/shared:ro
    networks:
      - backend
      - proxy

  employee-service:
    build:
      context: ./employee-service
    container_name: employee-service
    env_file: .env
    expose:
      - "8002"
    
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_started
      otel-collector:
        condition: service_started
    volumes:
      - ./shared:/app/shared:ro
    networks:
      - backend
      - proxy

  leave-service:
    build:
      context: ./leave-service
    container_name: leave-service
    env_file: .env
    expose:
      - "8003"
    
    depends_on:
      postgres:
        condition: service_started
      consul:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    volumes:
      - ./shared:/app/shared:ro
    networks:
      - backend
      - proxy


  notification-service:
    build:
      context: ./notification-service
    container_name: notification-service
    env_file: .env
    expose:
      - "8004"
    depends_on:
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: on-failure
    volumes:
      - ./shared:/app/shared:ro
    networks:
      - backend
      - proxy

networks:
  proxy:
  backend:
